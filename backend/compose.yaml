services:
  api-gateway:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      graphql-gateway: {condition: service_healthy}
      merchants-api: {condition: service_healthy}
      catalog-api: {condition: service_healthy}
      orders-api: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
  graphql-gateway:
    build:
      context: .
      dockerfile: graphql_gateway/Dockerfile
    environment:
      MERCHANTS_URL: http://merchants-api:8000
      CATALOG_URL: http://catalog-api:8000
      ORDERS_URL: http://orders-api:8000
    restart: unless-stopped
  merchants-api:
    build:
      context: .
      dockerfile: merchants/Dockerfile
    environment:
      DATABASE_URL: postgresql://merchants:${MERCHANTS_DB_PASSWORD:-merchants_local_only}@merchants-db:5432/merchants
    depends_on:
      merchants-db: {condition: service_healthy}
    networks: [default, merchants-data]
    restart: unless-stopped
  merchants-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: merchants
      POSTGRES_USER: merchants
      POSTGRES_PASSWORD: ${MERCHANTS_DB_PASSWORD:-merchants_local_only}
    volumes:
      - merchants-data:/var/lib/postgresql
    networks: [merchants-data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchants -d merchants"]
      interval: 5s
      timeout: 3s
      retries: 10
  catalog-api:
    build:
      context: .
      dockerfile: catalog/Dockerfile
    environment:
      DATABASE_URL: postgresql://catalog:${CATALOG_DB_PASSWORD:-catalog_local_only}@catalog-db:5432/catalog
      SERVICE_KEY: ${SERVICE_KEY:-base-grid-local-service-key}
    depends_on:
      catalog-db: {condition: service_healthy}
    networks: [default, catalog-data]
    restart: unless-stopped
  catalog-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_local_only}
    volumes:
      - catalog-data:/var/lib/postgresql
    networks: [catalog-data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10
  orders-api:
    build:
      context: .
      dockerfile: orders/Dockerfile
    environment:
      DATABASE_URL: postgresql://orders:${ORDERS_DB_PASSWORD:-orders_local_only}@orders-db:5432/orders
      SERVICE_KEY: ${SERVICE_KEY:-base-grid-local-service-key}
      MERCHANTS_URL: http://merchants-api:8000
      CATALOG_URL: http://catalog-api:8000
    depends_on:
      orders-db: {condition: service_healthy}
    networks: [default, orders-data]
    restart: unless-stopped
  orders-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_local_only}
    volumes:
      - orders-data:/var/lib/postgresql
    networks: [orders-data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  merchants-data:
  catalog-data:
  orders-data:
networks:
  merchants-data: {internal: true}
  catalog-data: {internal: true}
  orders-data: {internal: true}
