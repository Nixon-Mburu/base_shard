resolver 127.0.0.11 valid=5s ipv6=off;
upstream graphql_pool { zone graphql_pool 64k; server graphql-gateway:8000 resolve; keepalive 32; }
server {
    listen 80;
    server_name _;
    client_max_body_size 128k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    location = /health { default_type application/json; return 200 '{"status":"ok","service":"api-gateway"}'; }
    location = /graphql { proxy_pass http://graphql_pool; }
    location / { default_type application/json; return 404 '{"detail":"API route not found"}'; }
}
