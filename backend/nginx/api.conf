server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 128k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    location = /health { default_type application/json; return 200 '{"status":"ok","service":"api-gateway"}'; }
    location ~ ^/api/merchants(?:/|$) { set $merchants merchants-api:8000; proxy_pass http://$merchants; }
    location ~ ^/api/catalog(?:/|$) { set $catalog catalog-api:8000; proxy_pass http://$catalog; }
    location ~ ^/api/orders(?:/|$) { set $orders orders-api:8000; proxy_pass http://$orders; }
    location / { default_type application/json; return 404 '{"detail":"API route not found"}'; }
}
