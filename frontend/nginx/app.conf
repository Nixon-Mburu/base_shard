server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 include /etc/nginx/mime.types;
 location = /health { access_log off; default_type text/plain; return 200 'ok'; }
 location /assets/ { try_files $uri =404; add_header Cache-Control "no-cache"; }
 location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
