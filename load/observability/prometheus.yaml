global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules.yaml
scrape_configs:
  - job_name: otel
    honor_labels: true
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: locust
    static_configs:
      - targets: [locust-master:9646]
  - job_name: postgres
    static_configs:
      - targets: [merchants-metrics:9187, catalog-metrics:9187, orders-metrics:9187]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: base-grid-load
        action: keep
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
